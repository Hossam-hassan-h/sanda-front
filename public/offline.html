<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سندة — غير متصل</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Cairo', sans-serif;
        background: #fff;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .container { text-align: center; max-width: 400px; }
      .icon { width: 96px; height: 96px; background: #FFF7ED; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
      .icon svg { width: 48px; height: 48px; fill: #F97316; }
      h1 { font-size: 24px; margin-bottom: 12px; color: #1a1a1a; }
      p { font-size: 14px; color: #666; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      </div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى. التطبيق سيتم تحميله تلقائياً عند توفر الاتصال.</p>
    </div>
  </body>
</html>
